name: PR Preview

on:
  pull_request: {}

concurrency:
  group: ${{ workflow.filename }}-${{ github.ref }}
  cancel_in_progress: true

jobs:
  deploy:
    type: deploy
    name: Deploy PR Preview
    environment: production
    env:
      EXPO_PUBLIC_LIVE_SCHEDULE: '1'

  comment:
    needs: [deploy]
    type: github-comment
